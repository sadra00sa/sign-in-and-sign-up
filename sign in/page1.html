<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log in page</title>
        <link rel="stylesheet" href="./style/style.css">
    </head>
    <body>
        <div class="container">
           <form class="box" method="get">
            <img class="logo" src="./images/free_tshirt_black_0.svg" alt="logo" width="100px">
            <br>
            <p class="text">Log in Here</p>
            <input type="email" name="email" placeholder="email" required>
            <br>
            <input type="password" name="password" min="4" max="8" placeholder="password" required maxlength="8">
            <br>
            <br>
            <input class="submit" type="submit" value="Log in">
           </form>
         </div>
    </body>
</html>
